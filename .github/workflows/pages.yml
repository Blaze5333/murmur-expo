name: Publish Murmur

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'PROJECT_OVERVIEW.md', 'SUBMISSION.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/configure-pages@v5
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build:web
        env:
          MURMUR_BASE_PATH: /${{ github.event.repository.name }}
          EXPO_NO_TELEMETRY: '1'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
